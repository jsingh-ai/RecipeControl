[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipecontrol"
version = "0.1.0"
description = "Time-based OPC-UA break-rule timeline MVP"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
recipecontrol-worker = "recipecontrol.worker:main"
recipecontrol-live-worker = "recipecontrol.live_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/recipecontrol"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
exclude = ["backend/tests"]
