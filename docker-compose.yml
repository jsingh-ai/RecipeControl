services:
  app-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: recipecontrol
      MYSQL_USER: recipecontrol
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD:?set APP_DB_ROOT_PASSWORD in .env}
    ports: ["3307:3306"]
    volumes: ["recipecontrol_app_db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment: &backend_environment
      APP_DATABASE_URL: mysql+pymysql://recipecontrol:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@app-db:3306/recipecontrol
      SOURCE_ADAPTER: ${SOURCE_ADAPTER:-fixture}
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
    depends_on:
      app-db: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment: *backend_environment
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment: *backend_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["recipecontrol-worker"]

  live-worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment: *backend_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["recipecontrol-live-worker"]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  recipecontrol_app_db:
