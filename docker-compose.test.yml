services:
  collector-test-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opcua_collector_test
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 30

  app-test-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: recipecontrol_test
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports: ["3309:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 30
